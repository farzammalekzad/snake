<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #12141c;
      color: #e6e8ef;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #4ade80;
      text-shadow: 0 0 18px rgba(74, 222, 128, 0.35);
    }

    .scoreboard {
      display: flex;
      gap: 12px;
      font-variant-numeric: tabular-nums;
    }

    .scoreboard div {
      background: #1c1f2b;
      border: 1px solid #2a2e3d;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.9rem;
      color: #98a0b5;
    }

    .scoreboard span {
      display: block;
      font-size: 1.15rem;
      font-weight: 700;
      color: #e6e8ef;
    }

    #board {
      background: #0c0e14;
      border: 2px solid #2a2e3d;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(8, 10, 16, 0.82);
      border-radius: 12px;
      text-align: center;
      pointer-events: none;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay h2 {
      font-size: 1.6rem;
      letter-spacing: 2px;
    }

    .overlay p {
      font-size: 0.85rem;
      color: #98a0b5;
    }

    .controls {
      display: flex;
      gap: 16px;
      font-size: 0.75rem;
      color: #6b7280;
      flex-wrap: wrap;
      justify-content: center;
    }

    kbd {
      background: #1c1f2b;
      border: 1px solid #2a2e3d;
      border-bottom-width: 2px;
      border-radius: 4px;
      padding: 1px 6px;
      font-family: inherit;
      font-size: 0.7rem;
      color: #98a0b5;
    }

    .wrap {
      position: relative;
    }
  </style>
</head>
<body>
  <h1>Snake</h1>

  <div class="scoreboard">
    <div>Score<span id="score">0</span></div>
    <div>High<span id="high">0</span></div>
    <div>Level<span id="level">1</span></div>
  </div>

  <div class="wrap">
    <canvas id="board" width="480" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">Paused</h2>
      <p id="overlayText">Press Space to resume</p>
    </div>
  </div>

  <div class="controls">
    <span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to move</span>
    <span><kbd>Space</kbd> pause</span>
    <span><kbd>Enter</kbd> start / restart</span>
    <span>Swipe on touch devices</span>
  </div>

  <script>
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score");
    const highEl = document.getElementById("high");
    const levelEl = document.getElementById("level");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlayText = document.getElementById("overlayText");

    const GRID = 20;                 // cells per side
    const CELL = canvas.width / GRID; // pixel size of one cell
    const BASE_SPEED = 130;          // ms per step at level 1

    const DIRECTIONS = {
      ArrowUp: { x: 0, y: -1 }, w: { x: 0, y: -1 },
      ArrowDown: { x: 0, y: 1 }, s: { x: 0, y: 1 },
      ArrowLeft: { x: -1, y: 0 }, a: { x: -1, y: 0 },
      ArrowRight: { x: 1, y: 0 }, d: { x: 1, y: 0 }
    };

    let snake, food, dir, queuedDir, score, level, state, timer;

    function reset() {
      snake = [
        { x: 8, y: 10 },
        { x: 7, y: 10 },
        { x: 6, y: 10 }
      ];
      dir = { x: 1, y: 0 };
      queuedDir = dir;
      score = 0;
      level = 1;
      placeFood();
      updateHud();
    }

    function placeFood() {
      const free = [];
      for (let y = 0; y < GRID; y++) {
        for (let x = 0; x < GRID; x++) {
          if (!snake.some((s) => s.x === x && s.y === y)) free.push({ x, y });
        }
      }
      food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
    }

    function step() {
      // A queued turn can only apply if it doesn't reverse into our neck.
      if (queuedDir.x !== -dir.x || queuedDir.y !== -dir.y) dir = queuedDir;

      const head = {
        x: snake[0].x + dir.x,
        y: snake[0].y + dir.y
      };

      const hitWall = head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID;
      const hitSelf = snake.some((s) => s.x === head.x && s.y === head.y);

      if (hitWall || hitSelf) return gameOver();

      snake.unshift(head);

      if (food && head.x === food.x && head.y === food.y) {
        score += 10;
        level = 1 + Math.floor(score / 50);
        placeFood();
        updateHud();
        clearInterval(timer);
        timer = setInterval(step, Math.max(55, BASE_SPEED - (level - 1) * 8));
      } else {
        snake.pop();
      }

      draw();
    }

    function gameOver() {
      state = "over";
      clearInterval(timer);
      saveHigh();
      showOverlay("Game Over", `Score: ${score} — press Enter to play again`);
      draw();
    }

    function start() {
      reset();
      state = "playing";
      hideOverlay();
      clearInterval(timer);
      timer = setInterval(step, BASE_SPEED);
      draw();
    }

    function togglePause() {
      if (state === "playing") {
        state = "paused";
        clearInterval(timer);
        showOverlay("Paused", "Press Space to resume");
      } else if (state === "paused") {
        state = "playing";
        hideOverlay();
        timer = setInterval(step, Math.max(55, BASE_SPEED - (level - 1) * 8));
      }
    }

    function showOverlay(title, text) {
      overlayTitle.textContent = title;
      overlayText.textContent = text;
      overlay.classList.remove("hidden");
    }

    function hideOverlay() {
      overlay.classList.add("hidden");
    }

    function updateHud() {
      scoreEl.textContent = score;
      levelEl.textContent = level;
    }

    function loadHigh() {
      highEl.textContent = Number(localStorage.getItem("snakeHigh") || 0);
    }

    function saveHigh() {
      if (score > Number(localStorage.getItem("snakeHigh") || 0)) {
        localStorage.setItem("snakeHigh", score);
        loadHigh();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // grid
      ctx.strokeStyle = "#171a23";
      ctx.lineWidth = 1;
      for (let i = 1; i < GRID; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * CELL);
        ctx.lineTo(canvas.width, i * CELL);
        ctx.stroke();
      }

      // food
      if (food) {
        ctx.fillStyle = "#f87171";
        ctx.shadowColor = "#f87171";
        ctx.shadowBlur = 12;
        roundRect(food.x * CELL + 4, food.y * CELL + 4, CELL - 8, CELL - 8, 5);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // snake
      snake.forEach((seg, i) => {
        const t = i === 0 ? 1 : 1 - i / (snake.length + 4);
        ctx.fillStyle = `hsl(142, ${45 + t * 25}%, ${45 + t * 18}%)`;
        roundRect(seg.x * CELL + 1.5, seg.y * CELL + 1.5, CELL - 3, CELL - 3, 4);
        ctx.fill();
      });

      // eyes
      const head = snake[0];
      const eye = 3;
      const cx = head.x * CELL + CELL / 2;
      const cy = head.y * CELL + CELL / 2;
      const off = CELL * 0.18;
      ctx.fillStyle = "#0c0e14";
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.arc(
          cx + dir.x * off - dir.y * off * s,
          cy + dir.y * off + dir.x * off * s,
          eye,
          0,
          Math.PI * 2
        );
        ctx.fill();
      }
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // ---- input ----
    window.addEventListener("keydown", (e) => {
      const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;

      if (key === " " || e.code === "Space") {
        e.preventDefault();
        if (state === "over" || state === "ready") start();
        else togglePause();
        return;
      }

      if (key === "Enter") {
        e.preventDefault();
        if (state !== "playing") start();
        return;
      }

      const d = DIRECTIONS[key];
      if (d && state === "playing") {
        e.preventDefault();
        queuedDir = d;
      }
    });

    // touch swipe
    let touchStart = null;
    canvas.addEventListener("touchstart", (e) => {
      touchStart = e.touches[0];
      if (state === "ready" || state === "over") start();
    }, { passive: true });

    canvas.addEventListener("touchmove", (e) => {
      if (!touchStart || state !== "playing") return;
      e.preventDefault();
      const t = e.touches[0];
      const dx = t.clientX - touchStart.clientX;
      const dy = t.clientY - touchStart.clientY;
      if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
      queuedDir = Math.abs(dx) > Math.abs(dy)
        ? { x: Math.sign(dx), y: 0 }
        : { x: 0, y: Math.sign(dy) };
      touchStart = t;
    }, { passive: false });

    // ---- boot ----
    loadHigh();
    reset();
    state = "ready";
    showOverlay("Snake", "Press Enter or Space to start");
    draw();
  </script>
</body>
</html>
